name: Publish NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Serialize publish runs so a duplicate trigger (the release tag push and a
# workflow_dispatch firing within seconds of each other) cannot race: the second run
# waits for the first to finish, then the "Check Published Version" step sees the version
# already on npm and skips — instead of E403'ing on a double `npm publish`.
concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack Dry Run
        run: npm pack --dry-run

  publish:
    needs: verify
    # A workflow_dispatch from a branch never publishes; the ref-type guard
    # below enforces the same thing inside the job.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No `registry-url`: it writes an .npmrc token line that pins npm to the
      # token path, so OIDC trusted publishing would not be used.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # The release guards run before the install, so no lifecycle script from
      # the repository runs (with id-token: write) until the ref is a tag on
      # main whose version matches package.json. They only read files.
      # tests/node/publish-guards.test.mjs runs these guard scripts.
      - name: Verify Ref Is A Tag
        run: |
          # A branch named like a version (refs/heads/v0.1.0) has the same
          # GITHUB_REF_NAME as the tag, so the name checks alone cannot tell them apart.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "${GITHUB_REF} is a ${GITHUB_REF_TYPE}, not a tag; refusing to publish" >&2
            exit 1
          fi

      - name: Verify Tag Matches Package Version
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Verify Tagged Commit Is On Main
        run: |
          # Full fetch: a --depth=1 fetch would make this clone shallow at main's tip,
          # so any tagged commit behind that tip would look unreachable.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "FETCH_HEAD"; then
            echo "Tagged commit ${GITHUB_SHA} is not reachable from the fetched origin/main tip" >&2
            exit 1
          fi

      - name: Require npm With Trusted Publishing (>= 11.5.1)
        run: |
          # shellcheck disable=SC2016 # ${...} is a JS template literal, not shell.
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} cannot publish through OIDC; need >= 11.5.1`);
              process.exit(1);
            }' "$(npm --version)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Published Version
        id: published
        run: |
          PACKAGE_NAME=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")
          PACKAGE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      # `prepack` builds dist/ before the tarball is assembled.
      - name: Publish
        if: steps.published.outputs.published != 'true'
        run: npm publish --access public --provenance
