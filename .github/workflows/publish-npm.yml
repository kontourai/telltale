name: Publish NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # Publishing stays on the npm CLI: provenance and the registry binding are
      # properties of the publisher, not the installer, and `npm publish` needs
      # only the built package directory.
      #
      # No `registry-url` here, unlike ephemeris: it writes an .npmrc token line
      # that pins npm to the token path, so OIDC trusted publishing never runs.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile

      - name: Require npm with trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} cannot publish through OIDC; need >= 11.5.1`);
              process.exit(1);
            }' "$(npm --version)"

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('node:fs').readFileSync('package.json','utf8') && JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Verify tagged commit is on main
        run: |
          # Full fetch: a --depth=1 fetch would make this clone shallow at main's tip,
          # so any tagged commit behind that tip would look unreachable.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "Tagged commit ${GITHUB_SHA} is not reachable from origin/main" >&2
            exit 1
          fi

      - name: Skip if already published
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${NAME}@${VER} already published; skipping."
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish
        if: steps.published.outputs.published != 'true'
        run: npm publish --access public --provenance
